aid: georgiamune
name: Georgiamune
description: >-
  Georgiamune Inc. is a Gaithersburg, Maryland based biopharmaceutical company
  developing first-in-class immunotherapies that reprogram immune signaling
  pathways to rebalance the immune system and restore health across cancer and
  autoimmune diseases. Built on a target-discovery platform, its pipeline of
  immunomodulators spans clinical, preclinical, and discovery stages, including
  the clinical-stage dual-functioning antibody GIM-122, the regulatory T-cell
  (Treg) inhibitor GIM-531, and the Treg activator GIM-407, alongside additional
  antibody and small-molecule programs. The company was surfaced as a
  venture-backed portfolio company and profiled in the API Evangelist network;
  it does not currently publish a public API, developer portal, or programmatic
  interface.
